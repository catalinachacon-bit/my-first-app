<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de clics | Colegio Bolívar</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #eef4f0;
      color: #163e2a;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgb(22 62 42 / 12%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.8rem;
    }

    p {
      line-height: 1.5;
    }

    output {
      display: block;
      margin: 24px 0;
      font-size: 5rem;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    #incrementar {
      background: #17623d;
      color: white;
    }

    #incrementar:hover {
      background: #10492d;
    }

    #reiniciar {
      margin-top: 12px;
      background: #eef4f0;
      color: #163e2a;
    }

    button:focus-visible {
      outline: 3px solid #c48a10;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Colegio Bolívar</h1>
    <p>Contador de clics para nuestros eventos. ¡Haz clic y participa!</p>

    <output id="contador" aria-label="Total de clics" aria-live="polite">0</output>

    <button id="incrementar" type="button">¡Sumar un clic!</button>
    <button id="reiniciar" type="button">Reiniciar contador</button>
  </main>

  <script>
    let clics = 0;

    const contador = document.getElementById("contador");
    const incrementar = document.getElementById("incrementar");
    const reiniciar = document.getElementById("reiniciar");

    incrementar.addEventListener("click", () => {
      clics += 1;
      contador.textContent = clics;
    });

    reiniciar.addEventListener("click", () => {
      clics = 0;
      contador.textContent = clics;
    });
  </script>
</body>
</html>
