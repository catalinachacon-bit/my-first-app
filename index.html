<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Contador de clics | Colegio Bolívar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #edf5ff;
      background:
        radial-gradient(circle at top, #142c50, transparent 65%),
        #070e1f;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 40px 28px;
      text-align: center;
      background: #101c32;
      border: 1px solid #293c58;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgb(0 0 0 / 40%);
    }

    .etiqueta {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 12px;
      border: 1px solid #28717d;
      border-radius: 999px;
      background: #122e3c;
      color: #64f5df;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 6vw, 2rem);
      letter-spacing: -0.04em;
      overflow-wrap: anywhere;
    }

    p {
      margin: 0;
      color: #afbdd2;
      line-height: 1.6;
    }

    .campo {
      margin-top: 24px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd7e8;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #405779;
      border-radius: 10px;
      background: #0a1427;
      color: #edf5ff;
      font: inherit;
    }

    input::placeholder {
      color: #8b9bb3;
    }

    output {
      display: block;
      margin: 28px 0;
      color: #6af9e3;
      font-size: clamp(4rem, 18vw, 6rem);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      overflow-wrap: anywhere;
      text-shadow: 0 0 30px rgb(74 255 221 / 35%);
    }

    button {
      width: 100%;
      min-height: 50px;
      padding: 14px 20px;
      border: 1px solid transparent;
      border-radius: 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        background-color 160ms ease;
    }

    #incrementar {
      color: #061c24;
      background: linear-gradient(120deg, #65ffe0, #42d9ff);
      box-shadow: 0 0 22px rgb(66 217 255 / 22%);
    }

    #incrementar:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgb(66 217 255 / 40%);
    }

    #reiniciar {
      margin-top: 14px;
      color: #c6b0ff;
      background: #1c2340;
      border-color: #9670f5;
    }

    #reiniciar:hover {
      background: #2b2b50;
      box-shadow: 0 0 20px rgb(150 112 245 / 25%);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #6af9e3;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }

      button:hover,
      button:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="etiqueta">Colegio Bolívar</span>
    <h1 id="titulo-evento">Nuestros eventos</h1>
    <p>¡Cada clic cuenta! Participa y suma tu energía al evento.</p>

    <div class="campo">
      <label for="nombre-evento">Título del evento</label>
      <input
        id="nombre-evento"
        type="text"
        value="Nuestros eventos"
        placeholder="Escribe el nombre del evento"
        maxlength="80"
      >
    </div>

    <output id="contador" aria-label="Total de clics" aria-live="polite">0</output>

    <button id="incrementar" type="button">¡Sumar un clic!</button>
    <button id="reiniciar" type="button">Reiniciar Contador</button>
  </main>

  <script>
    let clics = 0;

    const contador = document.getElementById("contador");
    const incrementar = document.getElementById("incrementar");
    const reiniciar = document.getElementById("reiniciar");
    const nombreEvento = document.getElementById("nombre-evento");
    const tituloEvento = document.getElementById("titulo-evento");

    incrementar.addEventListener("click", () => {
      clics += 1;
      contador.textContent = clics;
    });

    reiniciar.addEventListener("click", () => {
      clics = 0;
      contador.textContent = clics;
    });

    nombreEvento.addEventListener("input", () => {
      tituloEvento.textContent = nombreEvento.value.trim() || "Nuestros eventos";
    });
  </script>
</body>
</html>
